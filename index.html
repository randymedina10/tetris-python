<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris · Randy A. Medina</title><link rel="stylesheet" href="style.css"></head><body data-game="tetris"><h1>Tetris</h1><div id="status" class="status" role="status" aria-live="polite">Cargando Python…</div><div id="score" class="score"></div><div id="next">Siguiente <div id="next-grid" aria-label="Siguiente pieza"></div></div><div id="board" role="group" aria-label="Tablero de juego"></div><div class="controls"><button data-action="left" aria-label="Mover izquierda">←</button><button data-action="rotate" aria-label="Girar pieza">↻</button><button data-action="right" aria-label="Mover derecha">→</button><button data-action="down" aria-label="Bajar pieza">↓</button><button data-action="drop">Caída</button><button data-action="pause" id="pause">Pausar</button></div><button id="reset" disabled>Nueva partida</button><button id="retry" hidden>Reintentar carga</button><p class="hint">Flechas: mover/girar · Espacio: caída · P: pausa. Haz clic dentro del juego para usar el teclado.</p><script src="app.js" defer></script></body></html>
